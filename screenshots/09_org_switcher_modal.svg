  <!-- Org 2 -->
  <rect x="32" y="315" width="336" height="65" rx="14" fill="#1F2937" stroke="#374151" />
  <circle cx="64" cy="347" r="18" fill="#374151" />
  <text x="64" y="353" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">₹</text>
  <text x="96" y="341" fill="#FFFFFF" font-size="13" font-weight="bold">Zenius India Pvt Ltd</text>
  <text x="96" y="359" fill="#94A3B8" font-size="10">India · INR (Enterprise Suite)</text>


      <!-- Bottom Navigation Bar -->
      <rect x="16" y="496" width="368" height="44" rx="22" fill="#0F172A" stroke="#334155" stroke-width="1" filter="url(#cardGlow)" />
      
          <g transform="translate(40, 520)">
