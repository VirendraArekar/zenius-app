      <circle cx="355" cy="51" r="12" fill="#334155" />
      <circle cx="355" cy="48" r="3" fill="#38BDF8" />

      <!-- Screen Content Body -->
      
  <rect x="20" y="78" width="360" height="90" rx="14" fill="#1E293B" opacity="0.4" />
  
  <!-- Bottom Modal Sheet Presentation -->
  <rect x="16" y="160" width="368" height="320" rx="24" fill="#111827" stroke="#4F46E5" stroke-width="1.5" />
  <rect x="180" y="172" width="40" height="4" rx="2" fill="#475569" />
  <text x="36" y="204" fill="#FFFFFF" font-size="14" font-weight="bold">Switch Organization Context</text>
  <text x="36" y="220" fill="#94A3B8" font-size="10">Tenant context updates currency & records dynamically.</text>

  <!-- Org 1: Active -->
  <rect x="32" y="236" width="336" height="65" rx="14" fill="#4F46E5" fill-opacity="0.15" stroke="#4F46E5" stroke-width="2" />
  <circle cx="64" cy="268" r="18" fill="#4F46E5" />
  <text x="64" y="274" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">$</text>
