  <text x="365" y="226" fill="#22D3EE" font-size="10" font-weight="bold" text-anchor="end">02:00 PM</text>

  <rect x="20" y="258" width="360" height="80" rx="14" fill="#1E293B" stroke="#334155" />
  <circle cx="45" cy="298" r="10" fill="#64748B" />
