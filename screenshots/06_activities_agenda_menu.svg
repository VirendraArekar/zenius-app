  <rect x="68" y="304" width="55" height="18" rx="5" fill="#F59E0B" fill-opacity="0.2" />
  <text x="95" y="316" fill="#F59E0B" font-size="8" font-weight="bold" text-anchor="middle">TASK</text>
  <text x="135" y="316" fill="#94A3B8" font-size="10">Global ERP Migration</text>
  <text x="365" y="316" fill="#F59E0B" font-size="10" font-weight="bold" text-anchor="end">04:30 PM</text>


      <!-- Bottom Navigation Bar -->
      <rect x="16" y="496" width="368" height="44" rx="22" fill="#0F172A" stroke="#334155" stroke-width="1" filter="url(#cardGlow)" />
      
          <g transform="translate(40, 520)">
