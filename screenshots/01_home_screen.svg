<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="400" height="550">
      <defs>
        <linearGradient id="deviceBg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0B0F19" />
          <stop offset="100%" stop-color="#111827" />
        </linearGradient>
        <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
        </filter>
      </defs>

      <!-- Mobile Device Shell -->
      <rect width="400" height="550" rx="32" fill="url(#deviceBg)" stroke="#1F2937" stroke-width="4" />

      <!-- Notch / Camera Island -->
      <rect x="130" y="6" width="140" height="18" rx="9" fill="#000000" />
      <circle cx="150" cy="15" r="4" fill="#1E293B" />
      <circle cx="240" cy="15" r="3" fill="#1E293B" />

      <!-- Status Bar -->
      <text x="32" y="20" fill="#94A3B8" font-size="10" font-weight="bold">9:41</text>
      <circle cx="350" cy="16" r="2.5" fill="#94A3B8" />
      <circle cx="360" cy="16" r="2.5" fill="#94A3B8" />
      <rect x="368" y="12" width="14" height="8" rx="2" fill="none" stroke="#94A3B8" stroke-width="1" />
      <rect x="370" y="14" width="9" height="4" rx="1" fill="#94A3B8" />

      <!-- App Header Bar -->
      <rect x="16" y="32" width="368" height="38" rx="12" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
      <circle cx="36" cy="51" r="5" fill="#10B981" />
      <text x="48" y="55" fill="#FFFFFF" font-size="12" font-weight="bold">Zenius One • Home</text>
      <circle cx="355" cy="51" r="12" fill="#334155" />
      <circle cx="355" cy="48" r="3" fill="#38BDF8" />

      <!-- Screen Content Body -->
      
  <rect x="20" y="78" width="360" height="115" rx="16" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1" />
  <text x="36" y="104" fill="#FFFFFF" font-size="14" font-weight="bold">Executive Command Center</text>
  <text x="36" y="122" fill="#A5B4FC" font-size="10">Live cross-suite revenue, pipeline & GPS sync</text>
  <rect x="36" y="136" width="95" height="24" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-opacity="0.4" />
  <text x="83" y="152" fill="#34D399" font-size="9" font-weight="bold" text-anchor="middle">OPERATIONAL</text>
  <rect x="140" y="136" width="120" height="24" rx="6" fill="#4F46E5" fill-opacity="0.3" />
  <text x="200" y="152" fill="#E0E7FF" font-size="9" font-weight="bold" text-anchor="middle">Acme Global (USD)</text>

  <!-- 4 KPI Cards -->
  <rect x="20" y="202" width="174" height="72" rx="12" fill="#1E293B" stroke="#334155" />
  <text x="32" y="222" fill="#94A3B8" font-size="9">Sales Pipeline</text>
  <text x="32" y="248" fill="#818CF8" font-size="16" font-weight="bold">$340,000</text>
  <text x="32" y="264" fill="#64748B" font-size="8">4 deals · 4 leads</text>

  <rect x="206" y="202" width="174" height="72" rx="12" fill="#1E293B" stroke="#334155" />
  <text x="218" y="222" fill="#94A3B8" font-size="9">Invoiced Revenue</text>
  <text x="218" y="248" fill="#34D399" font-size="16" font-weight="bold">$168,000</text>
  <text x="218" y="264" fill="#64748B" font-size="8">$42,000 receivable</text>

  <!-- Chart Card -->
  <rect x="20" y="284" width="360" height="120" rx="14" fill="#1E293B" stroke="#334155" />
  <text x="34" y="306" fill="#FFFFFF" font-size="11" font-weight="bold">Operations Volume Breakdown</text>
  <!-- Chart Bars -->
  <rect x="50" y="350" width="28" height="40" rx="4" fill="#4F46E5" />
  <rect x="105" y="325" width="28" height="65" rx="4" fill="#06B6D4" />
  <rect x="160" y="340" width="28" height="50" rx="4" fill="#10B981" />
  <rect x="215" y="360" width="28" height="30" rx="4" fill="#F59E0B" />
  <rect x="270" y="320" width="28" height="70" rx="4" fill="#EC4899" />
  <rect x="325" y="345" width="28" height="45" rx="4" fill="#8B5CF6" />

  <!-- Today Feed preview -->
  <rect x="20" y="414" width="360" height="70" rx="12" fill="#1E293B" stroke="#334155" />
  <circle cx="42" cy="449" r="14" fill="#4F46E5" fill-opacity="0.2" />
  <text x="66" y="442" fill="#FFFFFF" font-size="11" font-weight="bold">Product Demo Walkthrough</text>
  <text x="66" y="458" fill="#94A3B8" font-size="9">Apex Technologies (11:30 AM)</text>
  <rect x="295" y="438" width="70" height="20" rx="6" fill="#10B981" fill-opacity="0.2" />
  <text x="330" y="452" fill="#34D399" font-size="8" font-weight="bold" text-anchor="middle">Priority</text>


      <!-- Bottom Navigation Bar -->
      <rect x="16" y="496" width="368" height="44" rx="22" fill="#0F172A" stroke="#334155" stroke-width="1" filter="url(#cardGlow)" />
      
          <g transform="translate(40, 520)">
            <circle cx="0" cy="-8" r="12" fill="#4F46E5" fill-opacity="0.15" />
            <circle cx="0" cy="-8" r="3" fill="#4F46E5" />
            <text x="0" y="10" fill="#4F46E5" font-size="9" font-weight="bold" text-anchor="middle">Home</text>
          </g>
        
          <g transform="translate(120, 520)">
            <circle cx="0" cy="-8" r="12" fill="#64748B" fill-opacity="0" />
            <circle cx="0" cy="-8" r="3" fill="#64748B" />
            <text x="0" y="10" fill="#64748B" font-size="9" font-weight="normal" text-anchor="middle">Pipeline</text>
          </g>
        
          <g transform="translate(200, 520)">
            <circle cx="0" cy="-8" r="12" fill="#64748B" fill-opacity="0" />
            <circle cx="0" cy="-8" r="3" fill="#64748B" />
            <text x="0" y="10" fill="#64748B" font-size="9" font-weight="normal" text-anchor="middle">Check-In</text>
          </g>
        
          <g transform="translate(280, 520)">
            <circle cx="0" cy="-8" r="12" fill="#64748B" fill-opacity="0" />
            <circle cx="0" cy="-8" r="3" fill="#64748B" />
            <text x="0" y="10" fill="#64748B" font-size="9" font-weight="normal" text-anchor="middle">Zenius AI</text>
          </g>
        
          <g transform="translate(360, 520)">
            <circle cx="0" cy="-8" r="12" fill="#64748B" fill-opacity="0" />
            <circle cx="0" cy="-8" r="3" fill="#64748B" />
            <text x="0" y="10" fill="#64748B" font-size="9" font-weight="normal" text-anchor="middle">More</text>
          </g>
        
    </svg>