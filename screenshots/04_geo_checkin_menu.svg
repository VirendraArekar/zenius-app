<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="400" height="550">
      <defs>
        <linearGradient id="deviceBg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0B0F19" />
          <stop offset="100%" stop-color="#111827" />
        </linearGradient>
        <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
        </filter>
      </defs>

      <!-- Mobile Device Shell -->
      <rect width="400" height="550" rx="32" fill="url(#deviceBg)" stroke="#1F2937" stroke-width="4" />

      <!-- Notch / Camera Island -->
      <rect x="130" y="6" width="140" height="18" rx="9" fill="#000000" />
      <circle cx="150" cy="15" r="4" fill="#1E293B" />
      <circle cx="240" cy="15" r="3" fill="#1E293B" />

      <!-- Status Bar -->
      <text x="32" y="20" fill="#94A3B8" font-size="10" font-weight="bold">9:41</text>
      <circle cx="350" cy="16" r="2.5" fill="#94A3B8" />
      <circle cx="360" cy="16" r="2.5" fill="#94A3B8" />
      <rect x="368" y="12" width="14" height="8" rx="2" fill="none" stroke="#94A3B8" stroke-width="1" />
      <rect x="370" y="14" width="9" height="4" rx="1" fill="#94A3B8" />

      <!-- App Header Bar -->
      <rect x="16" y="32" width="368" height="38" rx="12" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
      <circle cx="36" cy="51" r="5" fill="#10B981" />
