      <circle cx="355" cy="51" r="12" fill="#334155" />
      <circle cx="355" cy="48" r="3" fill="#38BDF8" />

      <!-- Screen Content Body -->
      
  <rect x="20" y="78" width="360" height="32" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.3" />
  <text x="40" y="98" fill="#34D399" font-size="10" font-weight="bold">GPS High Precision • Anti-Mock Guard Active</text>

  <rect x="20" y="120" width="360" height="175" rx="18" fill="#065F46" stroke="#10B981" stroke-width="0.8" />
  <circle cx="200" cy="170" r="28" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
  <circle cx="200" cy="170" r="12" fill="#34D399" />
  <text x="200" y="220" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle">Currently Checked In</text>
  <text x="200" y="238" fill="#A7F3D0" font-size="10" text-anchor="middle">San Francisco HQ • Since 09:15 AM</text>
  <rect x="50" y="252" width="300" height="32" rx="8" fill="#FFFFFF" />
  <text x="200" y="273" fill="#EF4444" font-size="11" font-weight="bold" text-anchor="middle">CHECK OUT NOW</text>

  <rect x="20" y="310" width="360" height="165" rx="14" fill="#1E293B" stroke="#334155" />
  <text x="36" y="336" fill="#FFFFFF" font-size="12" font-weight="bold">Location Verification</text>
  <text x="36" y="360" fill="#94A3B8" font-size="9">Geofenced Site</text>
  <text x="36" y="376" fill="#E2E8F0" font-size="11" font-weight="bold">San Francisco HQ, 500 Howard St, CA 94105</text>
  <text x="36" y="406" fill="#94A3B8" font-size="9">Live Coordinates</text>
  <text x="36" y="422" fill="#38BDF8" font-size="11" font-weight="bold">37.7749° N, 122.4194° W (Accuracy: 4.2m)</text>
  <text x="36" y="450" fill="#34D399" font-size="10" font-weight="bold">✓ No GPS Spoofing Detected</text>


      <!-- Bottom Navigation Bar -->
      <rect x="16" y="496" width="368" height="44" rx="22" fill="#0F172A" stroke="#334155" stroke-width="1" filter="url(#cardGlow)" />
      
          <g transform="translate(40, 520)">
            <circle cx="0" cy="-8" r="12" fill="#64748B" fill-opacity="0" />
