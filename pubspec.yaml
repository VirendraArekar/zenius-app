name: zenius_app
description: "Zenius One Enterprise Mobile App — CRM, ERP, Geo Attendance, and AI Operations unified for iOS and Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Design & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lucide_icons: ^0.257.0

  # Charts & Visualizations
  fl_chart: ^0.69.0

  # State Management & Architecture
  provider: ^6.1.2

  # Networking & Serialization
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/images/
